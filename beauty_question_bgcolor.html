<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
.wrap{width:100%;max-width:390px;margin:0 auto;background:#f0f0f0;height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;position:relative;overflow:hidden;}
.scrollbar-hide::-webkit-scrollbar{display:none;}
.tag-pill{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:100px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;border:1px solid rgba(0,0,0,0.15);background:#fff;color:#888;}
.tag-pill.active{border-color:#D4537E;background:#FBEAF0;color:#72243E;}
.card-tag{display:inline-block;padding:3px 8px;border-radius:100px;font-size:11px;cursor:pointer;border:0.5px solid rgba(0,0,0,0.12);background:#f5f5f5;color:#888;}
.card-tag.active{border-color:#D4537E;background:#FBEAF0;color:#72243E;}
/* 질문 섹션 배경 */
.q-section{grid-column:1/-1;background:#F3EEF8;border-radius:14px;padding:14px 14px 12px;}
.q-section-title{font-size:13px;font-weight:600;color:#4a2060;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
/* 기존 카드 스타일 */
.q-card{border-radius:10px;border:1px solid rgba(0,0,0,0.11);background:#fff;padding:12px 12px 10px;cursor:pointer;flex-shrink:0;width:185px;height:80px;display:flex;flex-direction:column;justify-content:space-between;}
.q-card:hover{background:#f9f9f9;}
.q-icon{width:28px;height:28px;border-radius:50%;background:#F5F0E8;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;transition:transform 0.32s cubic-bezier(0.4,0,0.2,1),opacity 0.32s;overflow-y:auto;}
#sp{transform:translateX(0);opacity:1;}
#sc{transform:translateX(100%);opacity:0;display:flex;flex-direction:column;height:100%;}
.chat-open #sp{transform:translateX(-35%);opacity:0;pointer-events:none;}
.chat-open #sc{transform:translateX(0);opacity:1;}
.chat-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:0.5px solid #e5e5e5;background:#fff;position:sticky;top:0;z-index:10;flex-shrink:0;}
.back-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;}
.back-btn:hover{background:#f5f5f5;}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#D4537E,#a0387e);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;}
.msg-row{display:flex;gap:7px;align-items:flex-end;}
.msg-row.u{flex-direction:row-reverse;}
.bubble{max-width:78%;padding:9px 12px;border-radius:16px;font-size:13px;line-height:1.5;word-break:keep-all;}
.bubble.bot{background:#f5f5f5;color:#111;border-bottom-left-radius:3px;}
.bubble.u{background:#D4537E;color:#fff;border-bottom-right-radius:3px;}
.mtime{font-size:10px;color:#888;margin-bottom:2px;}
.typing{display:flex;gap:4px;padding:9px 12px;background:#f5f5f5;border-radius:16px;border-bottom-left-radius:3px;width:fit-content;}
.dot{width:6px;height:6px;border-radius:50%;background:#bbb;animation:bns 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes bns{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}
.pcard{background:#fff;border:0.5px solid #e5e5e5;border-radius:9px;overflow:hidden;width:150px;flex-shrink:0;}
.pscroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-top:7px;}
.pscroll::-webkit-scrollbar{display:none;}
.sq-chip{padding:5px 11px;border-radius:100px;border:1px solid #D4537E;color:#D4537E;font-size:11px;cursor:pointer;background:transparent;font-family:inherit;}
.sq-chip:hover{background:#FBEAF0;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.inp-wrap{padding:9px 12px 14px;border-top:0.5px solid #e5e5e5;display:flex;gap:7px;align-items:center;background:#fff;flex-shrink:0;}
.inp{flex:1;border:1px solid #e5e5e5;border-radius:20px;padding:8px 14px;font-size:13px;font-family:inherit;outline:none;color:#111;background:#f5f5f5;}
.inp:focus{border-color:#D4537E;}
.send-btn{width:34px;height:34px;border-radius:50%;background:#D4537E;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);z-index:100;opacity:0;pointer-events:none;transition:opacity 0.28s;}
.sheet-overlay.show{opacity:1;pointer-events:all;}
.sheet{position:absolute;bottom:0;left:0;width:100%;background:#fff;border-radius:18px 18px 0 0;padding:0 0 20px;transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);max-height:85%;}
.sheet-overlay.show .sheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:12px auto 0;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;}
.filter-section{padding:16px 18px 0;}
.filter-section-title{font-size:12px;font-weight:500;color:#888;margin-bottom:10px;letter-spacing:0.3px;}
.filter-tags{display:flex;flex-wrap:wrap;gap:7px;}
button.f-tag{padding:7px 14px;border-radius:100px;font-size:13px;cursor:pointer;border:1px solid #e0e0e0;background:#f0f0f0;color:#555;font-family:inherit;transition:all 0.15s;-webkit-appearance:none;}
button.f-tag.active{border-color:#D4537E !important;background:#FBEAF0 !important;color:#72243E !important;font-weight:500;}
.sort-options{display:flex;flex-direction:column;}
.sort-opt{padding:13px 0;font-size:14px;color:#333;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid #f0f0f0;}
.sort-opt:last-child{border-bottom:none;}
.sort-opt.active{color:#D4537E;font-weight:500;}
.sheet-footer{padding:14px 18px 0;display:flex;gap:9px;}
.sheet-btn-reset{flex:1;padding:13px;border-radius:12px;border:1px solid #e5e5e5;background:#fff;font-size:14px;color:#555;cursor:pointer;font-family:inherit;}
.sheet-btn-apply{flex:2;padding:13px;border-radius:12px;border:none;background:#D4537E;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="screen" id="sp">
    <div style="background:#fff;padding:12px 16px 0;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span style="font-size:17px;font-weight:500;color:#111;">전체 상품</span>
        <div style="display:flex;gap:14px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </div>
      </div>
      <div class="scrollbar-hide" style="overflow-x:auto;white-space:nowrap;margin:0 -16px;padding:0 16px 10px;border-bottom:0.5px solid #e5e5e5;">
        <div style="display:inline-flex;gap:6px;">
          <span style="display:inline-flex;align-items:center;padding:5px 13px;border-radius:100px;font-size:13px;cursor:pointer;border:1.5px solid #111;background:#111;color:#fff;font-weight:500;">전체</span>
          <span style="display:inline-flex;align-items:center;padding:5px 13px;border-radius:100px;font-size:13px;cursor:pointer;border:1px solid rgba(0,0,0,0.15);color:#888;">세럼</span>
          <span style="display:inline-flex;align-items:center;padding:5px 13px;border-radius:100px;font-size:13px;cursor:pointer;border:1px solid rgba(0,0,0,0.15);color:#888;">토너</span>
          <span style="display:inline-flex;align-items:center;padding:5px 13px;border-radius:100px;font-size:13px;cursor:pointer;border:1px solid rgba(0,0,0,0.15);color:#888;">크림</span>
          <span style="display:inline-flex;align-items:center;padding:5px 13px;border-radius:100px;font-size:13px;cursor:pointer;border:1px solid rgba(0,0,0,0.15);color:#888;">선케어</span>
        </div>
      </div>
      <div class="scrollbar-hide" style="overflow-x:auto;white-space:nowrap;margin:0 -16px;padding:8px 16px 10px;border-bottom:0.5px solid #e5e5e5;">
        <div id="filter-bar" style="display:inline-flex;gap:6px;align-items:center;"></div>
      </div>
    </div>
    <div style="padding:9px 16px 7px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:0.5px solid #e5e5e5;margin-bottom:2px;">
      <span style="font-size:12px;color:#888;" id="count-label">612개 상품</span>
      <div style="display:flex;align-items:center;gap:3px;cursor:pointer;" onclick="openFilter('sort')">
        <span style="font-size:12px;color:#888;" id="sort-label">리뷰 많은순</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>
    <div id="product-grid" style="padding:10px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;"></div>
  </div>

  <div class="screen" id="sc">
    <div class="chat-header">
      <div class="back-btn" onclick="closeChat()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
      </div>
      <div class="av">✨</div>
      <div>
        <div style="font-size:14px;font-weight:500;color:#111;">뷰티 AI 어시스턴트</div>
        <div style="font-size:11px;color:#22c55e;">● 온라인</div>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="inp-wrap">
      <input class="inp" id="inp" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="send-btn" onclick="sendMsg()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <div class="sheet-overlay" id="sheet-overlay" onclick="onOverlayClick(event)">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span style="font-size:16px;font-weight:500;color:#111;" id="sheet-title">필터</span>
        <div onclick="closeFilter()" style="cursor:pointer;padding:4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
      </div>
      <div id="sheet-body" style="overflow-y:auto;max-height:calc(85vh - 140px);"></div>
      <div class="sheet-footer" id="sheet-footer"></div>
    </div>
  </div>
</div>

<script>
const tags=[
  {label:"흡수력 좋음",active:false},{label:"끈적임 없음",active:false},
  {label:"촉촉함 유지",active:false},{label:"자극 없음",active:false},
  {label:"향 좋음",active:false},{label:"소량 충분",active:false},
  {label:"복합성",active:false},{label:"진정 효과",active:false},
];
const sortOptions=["리뷰 많은순","평점 높은순","낮은 가격순","높은 가격순"];
let currentSort="리뷰 많은순";
let tempTags=[];
const products=[
  {brand:"이니스프리",name:"그린티 씨드 세럼",price:"28,000",priceN:28000,rating:4.5,reviews:3241,badge:"베스트",tags:["흡수력 좋음","자극 없음"]},
  {brand:"라네즈",name:"워터뱅크 세럼",price:"45,000",priceN:45000,rating:4.5,reviews:2188,badge:"베스트",tags:["촉촉함 유지","복합성"]},
  {brand:"토리든",name:"다이브인 세럼",price:"19,800",priceN:19800,rating:4.5,reviews:5670,badge:"베스트",tags:["흡수력 좋음","소량 충분"]},
  {brand:"아누아",name:"어성초 토너패드",price:"18,000",priceN:18000,rating:4.5,reviews:8934,badge:"베스트",tags:["자극 없음","진정 효과"]},
  {brand:"닥터지",name:"레드 블레미쉬 크림",price:"22,000",priceN:22000,rating:4.5,reviews:4120,badge:null,tags:["진정 효과","자극 없음"]},
  {brand:"코스알엑스",name:"달팽이 에센스",price:"31,000",priceN:31000,rating:4.5,reviews:6780,badge:null,tags:["흡수력 좋음","향 좋음"]},
];
const qs=[
  {icon:"💧",q:"복합성 피부에 산뜻한\n수분 세럼 추천해줘"},
  {icon:"🌿",q:"끈적임 없는 여름용\n세럼 뭐가 좋아?"},
  {icon:"🌸",q:"민감한 피부에 자극\n없는 토너 추천해줘"},
  {icon:"⭐",q:"리뷰 가장 많은\n진정 크림 추천해줘"},
  {icon:"🍃",q:"소량으로도 충분한\n에센스 있어?"},
];
const answers={
  "복합성 피부에 산뜻한 수분 세럼 추천해줘":{text:"복합성 피부에 딱 맞는 산뜻한 수분 세럼이에요 🌿\n유분은 잡으면서 수분은 충분히 채워줘요.",prods:[0,1],follow:["지성 T존에 더 집중하고 싶어","건성 U존도 케어되나요?"]},
  "끈적임 없는 여름용 세럼 뭐가 좋아?":{text:"여름엔 가볍고 산뜻한 텍스처가 핵심이죠 ☀️\n흡수가 빠르고 끈적임이 없어요.",prods:[0,2],follow:["선크림이랑 같이 써도 되나요?","지성 피부에도 괜찮나요?"]},
  "민감한 피부에 자극 없는 토너 추천해줘":{text:"저자극 성분으로 만들어진 제품들이에요 🌸\n예민한 피부도 안심하고 쓸 수 있어요.",prods:[3,4],follow:["알코올 없는 제품 있나요?","피부 장벽 강화에도 좋나요?"]},
  "리뷰 가장 많은 진정 크림 추천해줘":{text:"리뷰 수로 검증된 진정 크림이에요 ⭐\n실제 사용자 만족도가 높은 제품들이에요.",prods:[3,4],follow:["빨개진 피부에도 효과 있나요?","자기 전에 쓰면 더 좋나요?"]},
  "소량으로도 충분한 에센스 있어?":{text:"펌프 한두 번이면 충분한 제품들이에요 🍃\n가성비도 좋고 오래 쓸 수 있어요.",prods:[2,5],follow:["용량 대비 가격이 괜찮나요?","한 병에 몇 달이나 써요?"]},
};

function stars(r){return Array.from({length:5},(_,i)=>`<svg width="11" height="11" viewBox="0 0 24 24" fill="${i<Math.round(r)?'#F59E0B':'#E5E7EB'}" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`).join('');}
function toggleTag(label){const t=tags.find(t=>t.label===label);if(t){t.active=!t.active;render();}}
function sortProducts(list){
  const s=[...list];
  if(currentSort==="평점 높은순") s.sort((a,b)=>b.rating-a.rating);
  else if(currentSort==="낮은 가격순") s.sort((a,b)=>a.priceN-b.priceN);
  else if(currentSort==="높은 가격순") s.sort((a,b)=>b.priceN-a.priceN);
  else s.sort((a,b)=>b.reviews-a.reviews);
  return s;
}

function buildBanner(){
  const section=document.createElement('div');
  section.className='q-section';
  const titleEl=document.createElement('div');
  titleEl.className='q-section-title';
  titleEl.innerHTML='✨ AI에게 바로 물어보세요';
  section.appendChild(titleEl);
  const sw=document.createElement('div');
  sw.className='scrollbar-hide';
  sw.style.cssText='overflow-x:auto;margin:0 -2px;padding:0 2px 2px;';
  const row=document.createElement('div');
  row.style.cssText='display:flex;gap:8px;width:max-content;padding-right:4px;';
  qs.forEach(item=>{
    const lines=item.q.split('\n');
    const card=document.createElement('div');
    card.className='q-card';
    card.innerHTML=`<div style="display:flex;align-items:center;gap:8px;"><div class="q-icon">${item.icon}</div><div>${lines.map(l=>`<p style="margin:0;font-size:12px;line-height:1.45;color:#111;">${l}</p>`).join('')}</div></div><div style="display:flex;justify-content:flex-end;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>`;
    card.onclick=()=>openChat(item.q.replace(/\n/g,' '));
    row.appendChild(card);
  });
  sw.appendChild(row);section.appendChild(sw);
  return section;
}

const THUMB=`<div style="height:120px;background:#f7f7f7;border-bottom:0.5px solid #e5e5e5;display:flex;align-items:center;justify-content:center;position:relative;">`;
const THUMB_ICON=`<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d8d8d8" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;

function render(){
  const active=tags.filter(t=>t.active).map(t=>t.label);
  const bar=document.getElementById('filter-bar');bar.innerHTML='';
  const ac=active.length;
  const btn=document.createElement('span');
  btn.style.cssText=`display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:100px;font-size:12px;border:1px solid ${ac?'#D4537E':'rgba(0,0,0,0.2)'};color:${ac?'#72243E':'#888'};background:${ac?'#FBEAF0':'transparent'};cursor:pointer;white-space:nowrap;`;
  btn.innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> 필터${ac?' '+ac:''}`;
  btn.onclick=()=>openFilter('filter');bar.appendChild(btn);
  tags.forEach(t=>{
    const pill=document.createElement('span');
    pill.className='tag-pill'+(t.active?' active':'');
    pill.innerHTML=t.active?`${t.label} <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`:t.label;
    pill.onclick=()=>toggleTag(t.label);bar.appendChild(pill);
  });
  document.getElementById('sort-label').textContent=currentSort;
  let filtered=active.length?products.filter(p=>active.some(a=>p.tags.includes(a))):products;
  filtered=sortProducts(filtered);
  document.getElementById('count-label').textContent=`${filtered.length*102}개 상품`;
  const grid=document.getElementById('product-grid');grid.innerHTML='';
  filtered.forEach((p,i)=>{
    if(i===2){
      const wrap=document.createElement('div');wrap.style.cssText='grid-column:1/-1;';
      wrap.appendChild(buildBanner());grid.appendChild(wrap);
    }
    const tagHtml=p.tags.map(label=>`<span class="card-tag${tags.find(t=>t.label===label)?.active?' active':''}" onclick="toggleTag('${label}')">${label}</span>`).join('');
    const card=document.createElement('div');card.style.cssText='background:#fff;border-radius:10px;overflow:hidden;border:0.5px solid #e5e5e5;';
    card.innerHTML=`${THUMB}${p.badge?`<span style="position:absolute;top:8px;left:8px;font-size:10px;font-weight:500;background:#fff;color:#111;padding:2px 7px;border-radius:4px;border:0.5px solid #e5e5e5;">${p.badge}</span>`:''}${THUMB_ICON}<div style="padding:9px;"><p style="font-size:11px;color:#888;margin:0 0 2px;">${p.brand}</p><p style="font-size:13px;color:#111;margin:0 0 3px;line-height:1.35;">${p.name}</p><p style="font-size:13px;font-weight:500;color:#111;margin:0 0 6px;">${p.price}원</p><div style="display:flex;align-items:center;gap:2px;margin-bottom:6px;">${stars(p.rating)}<span style="font-size:11px;color:#888;margin-left:2px;">(${p.reviews.toLocaleString()})</span></div><div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml}</div></div>`;
    grid.appendChild(card);
  });
  if(!filtered.length){const e=document.createElement('div');e.style.cssText='grid-column:1/-1;text-align:center;padding:40px 0;color:#888;font-size:14px;';e.textContent='조건에 맞는 상품이 없어요';grid.appendChild(e);}
}

function openFilter(mode){
  tempTags=tags.map(t=>({...t}));
  const overlay=document.getElementById('sheet-overlay'),title=document.getElementById('sheet-title'),body=document.getElementById('sheet-body'),footer=document.getElementById('sheet-footer');
  if(mode==='filter'){
    title.textContent='필터';
    body.innerHTML=`<div class="filter-section"><div class="filter-section-title">구매자 리얼 리뷰</div><div class="filter-tags" id="ft-tags"></div></div><div class="filter-section" style="margin-top:4px;"><div class="filter-section-title">가격대</div><div class="filter-tags" id="ft-price"></div></div><div class="filter-section" style="margin-top:4px;padding-bottom:8px;"><div class="filter-section-title">브랜드</div><div class="filter-tags" id="ft-brand"></div></div>`;
    ['~2만원','2~3만원','3만원~'].forEach(label=>{const b=document.createElement('button');b.className='f-tag';b.textContent=label;b.style.cssText='background:#f0f0f0;border-color:#e0e0e0;color:#555;';b.onclick=()=>{b.classList.toggle('active');if(b.classList.contains('active'))b.style.cssText='background:#FBEAF0;border-color:#D4537E;color:#72243E;font-weight:500;';else b.style.cssText='background:#f0f0f0;border-color:#e0e0e0;color:#555;font-weight:400;';};document.getElementById('ft-price').appendChild(b);});
    ['이니스프리','라네즈','토리든','아누아','닥터지','코스알엑스'].forEach(label=>{const b=document.createElement('button');b.className='f-tag';b.textContent=label;b.style.cssText='background:#f0f0f0;border-color:#e0e0e0;color:#555;';b.onclick=()=>{b.classList.toggle('active');if(b.classList.contains('active'))b.style.cssText='background:#FBEAF0;border-color:#D4537E;color:#72243E;font-weight:500;';else b.style.cssText='background:#f0f0f0;border-color:#e0e0e0;color:#555;font-weight:400;';};document.getElementById('ft-brand').appendChild(b);});
    renderSheetTags();
    footer.innerHTML=`<button class="sheet-btn-reset" onclick="resetFilter()">초기화</button><button class="sheet-btn-apply" id="apply-btn" onclick="applyFilter()">${countActive()?`적용하기 (${countActive()})`:'적용하기'}</button>`;
  } else {
    title.textContent='정렬';body.innerHTML=`<div class="filter-section"><div class="sort-options" id="sort-opts"></div></div>`;
    const opts=document.getElementById('sort-opts');
    sortOptions.forEach(s=>{const div=document.createElement('div');div.className='sort-opt'+(s===currentSort?' active':'');div.innerHTML=`${s}${s===currentSort?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4537E" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`:''}`;div.onclick=()=>{currentSort=s;closeFilter();render();};opts.appendChild(div);});
    footer.innerHTML='';
  }
  overlay.classList.add('show');
}
function countActive(){return tempTags.filter(t=>t.active).length;}
function renderSheetTags(){
  const c=document.getElementById('ft-tags');if(!c)return;c.innerHTML='';
  tempTags.forEach((t,i)=>{const btn=document.createElement('button');btn.className='f-tag'+(t.active?' active':'');if(t.active)btn.style.cssText='background:#FBEAF0;border-color:#D4537E;color:#72243E;font-weight:500;';else btn.style.cssText='background:#f0f0f0;border-color:#e0e0e0;color:#555;';btn.textContent=t.label;btn.onclick=()=>{tempTags[i].active=!tempTags[i].active;if(tempTags[i].active){btn.style.cssText='background:#FBEAF0;border-color:#D4537E;color:#72243E;font-weight:500;';btn.classList.add('active');}else{btn.style.cssText='background:#f0f0f0;border-color:#e0e0e0;color:#555;font-weight:400;';btn.classList.remove('active');}updateApplyBtn();};c.appendChild(btn);});
}
function updateApplyBtn(){const btn=document.getElementById('apply-btn');if(!btn)return;const ac=countActive();btn.textContent=ac?`적용하기 (${ac})`:'적용하기';}
function resetFilter(){tempTags.forEach(t=>t.active=false);tags.forEach(t=>t.active=false);renderSheetTags();document.querySelectorAll('#ft-price .f-tag,#ft-brand .f-tag').forEach(el=>{el.classList.remove('active');el.style.cssText='background:#f0f0f0;border-color:#e0e0e0;color:#555;font-weight:400;';});updateApplyBtn();render();}
function applyFilter(){tempTags.forEach((t,i)=>tags[i].active=t.active);closeFilter();render();}
function closeFilter(){document.getElementById('sheet-overlay').classList.remove('show');}
function onOverlayClick(e){if(e.target===document.getElementById('sheet-overlay'))closeFilter();}
function nowTime(){const d=new Date();const h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');return`${h<12?'오전':'오후'} ${h%12||12}:${m}`;}
function scrollBot(){const el=document.getElementById('msgs');setTimeout(()=>el.scrollTo({top:el.scrollHeight,behavior:'smooth'}),50);}
function addUserMsg(text){const msgs=document.getElementById('msgs');const row=document.createElement('div');row.className='msg-row u';row.innerHTML=`<div><div style="text-align:right;"><span class="mtime">${nowTime()}</span></div><div class="bubble u">${text.replace(/\n/g,'<br>')}</div></div>`;msgs.appendChild(row);scrollBot();}
function addBotMsg(text,prods=[],follow=[]){
  const msgs=document.getElementById('msgs');const row=document.createElement('div');row.className='msg-row';
  let ph='';if(prods.length){const cards=prods.map(i=>{const p=products[i];return`<div class="pcard"><div style="height:64px;background:#f7f7f7;border-bottom:0.5px solid #e5e5e5;display:flex;align-items:center;justify-content:center;position:relative;">${p.badge?`<span style="position:absolute;top:4px;left:4px;font-size:9px;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:0.5px solid #e5e5e5;">${p.badge}</span>`:''}<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d8d8d8" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div><div style="padding:7px;"><p style="font-size:10px;color:#888;margin:0 0 1px;">${p.brand}</p><p style="font-size:12px;color:#111;margin:0 0 3px;line-height:1.3;">${p.name}</p><p style="font-size:12px;font-weight:600;color:#111;margin:0;">${p.price}원</p></div></div>`;}).join('');ph=`<div class="pscroll">${cards}</div>`;}
  let fh='';if(follow.length){fh=`<div class="chips">${follow.map(q=>`<button class="sq-chip" onclick="doFollow('${q}')">${q}</button>`).join('')}</div>`;}
  row.innerHTML=`<div class="av" style="width:26px;height:26px;font-size:12px;flex-shrink:0;">✨</div><div><span class="mtime">${nowTime()}</span><div class="bubble bot">${text.replace(/\n/g,'<br>')}${ph}${fh}</div></div>`;
  msgs.appendChild(row);scrollBot();
}
function showTyping(cb){const msgs=document.getElementById('msgs');const row=document.createElement('div');row.className='msg-row';row.id='tr';row.innerHTML=`<div class="av" style="width:26px;height:26px;font-size:12px;flex-shrink:0;">✨</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;msgs.appendChild(row);scrollBot();setTimeout(()=>{const tr=document.getElementById('tr');if(tr)tr.remove();cb();},1400);}
function openChat(q){document.getElementById('msgs').innerHTML='';document.getElementById('app').classList.add('chat-open');addBotMsg("안녕하세요! 뷰티 AI 어시스턴트예요 ✨\n원하는 제품을 찾을 수 있게 도와드릴게요!");setTimeout(()=>{addUserMsg(q);showTyping(()=>{const ans=answers[q]||{text:"관련 제품을 찾아봤어요 😊",prods:[0,1],follow:["다른 조건으로 찾아줘","성분도 알려줘"]};addBotMsg(ans.text,ans.prods,ans.follow);});},350);}
function closeChat(){document.getElementById('app').classList.remove('chat-open');}
function doFollow(q){addUserMsg(q);showTyping(()=>{addBotMsg("좋은 질문이에요! 😊\n피부 타입을 알려주시면 더 잘 도와드릴 수 있어요!",[],["지성 피부예요","건성 피부예요","복합성 피부예요"]);});}
function sendMsg(){const inp=document.getElementById('inp');const text=inp.value.trim();if(!text)return;inp.value='';addUserMsg(text);showTyping(()=>{addBotMsg("입력하신 내용을 분석하고 있어요 🔍\n피부 타입을 알려주시면 더 정확하게 추천드릴게요!",[],["지성 피부예요","건성 피부예요","복합성 피부예요"]);});}

render();
</script>
</body>
</html>
